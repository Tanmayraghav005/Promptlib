name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unpack project
        run: unzip -q -o project.zip -d app
      - name: Build web app
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Build APK
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: prompt-library-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Prompt Library APK ${{ github.run_number }}
          files: app/android/app/build/outputs/apk/debug/app-debug.apk
